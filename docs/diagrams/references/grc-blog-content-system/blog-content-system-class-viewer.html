<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Blog UML 全景图</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8eef5;color:#17243a;font:15px "Microsoft YaHei",sans-serif}header{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;background:#fff;border-bottom:1px solid #cbd5e1}h1{font-size:18px;margin:0 auto 0 0}button,a{padding:7px 12px;border:1px solid #bccbdb;border-radius:5px;background:#fff;color:#203854;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#edf4fb}#stage{height:calc(100vh - 64px);overflow:hidden;position:relative;cursor:grab;touch-action:none}#stage.dragging{cursor:grabbing}img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;max-width:none}#scale{min-width:55px;text-align:center}.hint{font-size:12px;color:#64748b}</style>
<header><h1>Blog 内容生产系统 · UML 全景图</h1><span class="hint">滚轮缩放 · 拖动查看</span><button id="minus" aria-label="缩小">−</button><output id="scale"></output><button id="plus" aria-label="放大">＋</button><button id="fit">适应窗口</button><button id="actual">100%</button><a href="blog-content-system-class.svg" download>SVG</a><a href="blog-content-system-class.png" download>PNG</a></header><main id="stage"><img id="diagram" src="blog-content-system-class.svg" draggable="false" alt="Blog 内容生产系统 UML 全景类图，七个分区展开配置、选题、资料文件、写作、校验、发布与复盘"></main><script>
const stage=document.getElementById('stage'),img=document.getElementById('diagram');let z=1,x=0,y=0,drag=null;
function draw(){img.style.transform=`translate(${x}px,${y}px) scale(${z})`;document.getElementById('scale').textContent=Math.round(z*100)+'%'}
function zoom(n,cx=stage.clientWidth/2,cy=stage.clientHeight/2){n=Math.min(3,Math.max(.08,n));x=cx-(cx-x)*n/z;y=cy-(cy-y)*n/z;z=n;draw()}
function fit(){z=Math.min((stage.clientWidth-40)/img.naturalWidth,(stage.clientHeight-40)/img.naturalHeight);x=(stage.clientWidth-img.naturalWidth*z)/2;y=(stage.clientHeight-img.naturalHeight*z)/2;draw()}
document.getElementById('plus').onclick=()=>zoom(z*1.35);document.getElementById('minus').onclick=()=>zoom(z/1.35);document.getElementById('fit').onclick=fit;document.getElementById('actual').onclick=()=>zoom(1);
stage.addEventListener('wheel',e=>{e.preventDefault();const r=stage.getBoundingClientRect();zoom(z*(e.deltaY<0?1.15:1/1.15),e.clientX-r.left,e.clientY-r.top)},{passive:false});
stage.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox:x,oy:y};stage.setPointerCapture(e.pointerId);stage.classList.add('dragging')};stage.onpointermove=e=>{if(drag){x=drag.ox+e.clientX-drag.x;y=drag.oy+e.clientY-drag.y;draw()}};stage.onpointerup=stage.onpointercancel=()=>{drag=null;stage.classList.remove('dragging')};img.onload=fit;window.addEventListener('resize',fit);if(img.complete&&img.naturalWidth)fit();
</script></html>
