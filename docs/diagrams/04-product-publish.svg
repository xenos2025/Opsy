<text x="390" y="478" text-anchor="middle" class="label-tiny" font-size="10">一项失败不拖累其他</text>

<rect x="520" y="188" width="220" height="520" rx="4" fill="#FFFFFF" stroke="#C15F3C" stroke-width="1.8"/>
