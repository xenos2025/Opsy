<rect x="60" y="590" width="1080" height="130" rx="4" fill="#FFFFFF" stroke="#C15F3C" stroke-width="1.6"/>
<text x="90" y="622" class="label-accent" font-size="14">SETUP · 进入运营菜单之前</text>
