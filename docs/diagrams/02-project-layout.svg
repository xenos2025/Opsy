<text x="940" y="652" class="label" font-size="14">4. write_ready</text>
<text x="90" y="688" class="label-tiny" font-size="12">opsy.mjs init 只补缺失文件 · doctor 检查 Node/Git/CLI · 连接与档案见 07-connection-profile.svg</text>

