query OpsyArticleReadback($id: ID!) {
  article(id: $id) {
    id
    title
    handle
    body
    summary
    tags
    isPublished
    publishedAt
    updatedAt
    seoTitle: metafield(namespace: "global", key: "title_tag") { id type value compareDigest }
    seoDescription: metafield(namespace: "global", key: "description_tag") { id type value compareDigest }
    blog {
      id
      title
      handle
    }
    author {
      name
    }
    image {
      altText
      url
    }
  }
}
