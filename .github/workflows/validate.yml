name: Validate Opsy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - run: npm test
      - run: npm run validate
      - run: bash -n install.sh uninstall.sh
      - run: ./install.sh --host both --codex-root "$RUNNER_TEMP/codex/skills" --workbuddy-root "$RUNNER_TEMP/workbuddy/skills" --dry-run
